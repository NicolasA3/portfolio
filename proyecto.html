<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Fernando Adasme | Proyecto</title>
  <meta name="description" content="Detalles y galería de imágenes del proyecto." />
  <meta name="author" content="Fernando Adasme" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/cursor.css" />
  <link rel="stylesheet" href="/css/sections.css" />
  <link rel="stylesheet" href="/css/proyecto.css" />
  <link rel="stylesheet" href="/css/responsive.css" />

  <!-- JS -->
  <script type="module" src="/js/proyecto.js" defer></script>
</head>

<body>
  <!-- Custom Cursor -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- Starfield Canvas -->
  <canvas id="starfield" style="display: none;"></canvas>

  <!-- ===================== NAVIGATION ===================== -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/#projects" class="nav-logo" aria-label="Volver">
        <div class="nav-logo-icon">←</div>
      </a>

      <ul class="nav-links">
        <li>
          <a href="/#projects" class="nav-link" data-i18n="project.back">← Volver al Portafolio</a>
        </li>
      </ul>

      <div class="nav-actions">
        <div class="lang-toggle" id="lang-toggle">
          <button class="lang-btn active" data-lang="es">ES</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===================== PROJECT DETAILS & GALLERY ===================== -->
  <section class="section project-detail-section">
    <div class="container">
      
      <!-- Project Header Info -->
      <div class="glass-card project-detail-card">
        <div class="project-detail-content">
          <div class="project-detail-meta">
            <h1 id="project-title" class="project-detail-title">Cargando Proyecto...</h1>
            <div id="project-tech" class="project-tech">
              <!-- Tech tags loaded dynamically -->
            </div>
            <p id="project-description" class="project-detail-desc">
              Cargando descripción...
            </p>
            <div class="project-detail-links">
              <div id="project-links-container" class="project-links">
                <!-- Links loaded dynamically -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Gallery Heading -->
      <div class="gallery-header">
        <h2 class="gallery-title" data-i18n="project.gallery_title">Galería de Capturas</h2>
        <p class="gallery-subtitle" data-i18n="project.gallery_subtitle">Explora el diseño e interfaz del proyecto</p>
      </div>

      <!-- Gallery Grid -->
      <div id="gallery-grid" class="gallery-grid">
        <!-- Images loaded dynamically -->
      </div>
    </div>
  </section>

  <!-- ===================== LIGHTBOX MODAL ===================== -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog">
    <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">×</button>
    <button class="lightbox-arrow lightbox-prev" id="lightbox-prev" aria-label="Anterior">‹</button>
    <button class="lightbox-arrow lightbox-next" id="lightbox-next" aria-label="Siguiente">›</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Vista ampliada" />
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-left">
        <span>© 2025 Fernando Adasme</span>
        <span>·</span>
        <span data-i18n="footer.made">Hecho con ☕ y 🤖</span>
      </div>

      <div class="footer-socials">
        <a href="https://github.com/NicolasA3" target="_blank" rel="noopener" class="footer-social" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/adasmec" target="_blank" rel="noopener" class="footer-social" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
      </div>
    </div>
  </footer>

</body>
</html>
